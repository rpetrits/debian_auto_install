# =====================================================================
# DEBIAN PRESEED CONFIGURATION
# =====================================================================

# ---------------------------------------------------------------------
# 0. ALLGEMEINE INSTALLER-PRIORITÄT
# ---------------------------------------------------------------------
# Nur kritische Fragen werden gestellt – alle anderen werden übersprungen
d-i debconf/priority string critical

# ---------------------------------------------------------------------
# 1. SPRACHE, REGION UND TASTATUR
# ---------------------------------------------------------------------
d-i debian-installer/locale string de_AT.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select at
d-i keyboard-configuration/layout select at
d-i keyboard-configuration/variant select

# ---------------------------------------------------------------------
# 2. NETZWERK-KONFIGURATION
# ---------------------------------------------------------------------
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-server

# ---------------------------------------------------------------------
# 3. SPIEGELSERVER (MIRROR)
# ---------------------------------------------------------------------
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian

# ---------------------------------------------------------------------
# 4. BENUTZERKONTEN
# ---------------------------------------------------------------------
# Root-Konto deaktivieren (wird über sudo gelöst)
d-i passwd/root-login boolean false

# Standard-Benutzerkonto 'default'
d-i passwd/user-fullname string Default User
d-i passwd/username string default
d-i passwd/user-password password start123
d-i passwd/user-password-again password start123

# ---------------------------------------------------------------------
# 5. UHRZEIT UND ZEITZONE
# ---------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Vienna
d-i clock-setup/ntp boolean true

# ---------------------------------------------------------------------
# 6. PARTITIONIERUNG (Klassisch / Regular – OHNE LVM)
# ---------------------------------------------------------------------
# USB-Stick automatisch ausschließen und interne Festplatte dynamisch ermitteln
d-i partman/early_command string \
    DISK=$(list-devices disk | grep -v "$(list-devices usb-partition | sed 's/[0-9]*$//' | head -1)" | head -1); \
    debconf-set partman-auto/disk "$DISK"; \
    debconf-set grub-installer/bootdev "$DISK"

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

# Bestehende LVM- und RAID-Strukturen automatisch entfernen
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true

# Automatische Bestätigungen für das Überschreiben bestehender Datenstrukturen
d-i partman/confirm_write_new_label boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm_nooverwrite boolean false
d-i partman/choose_partition select finish
d-i partman/confirm boolean true

# ---------------------------------------------------------------------
# 7. PAKETAUSWAHL (Absolutes Minimalsystem – KEIN Desktop)
# ---------------------------------------------------------------------
tasksel tasksel/first multiselect standard,ssh-server
d-i pkgsel/include string sudo,curl,git
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# ---------------------------------------------------------------------
# 8. BOOTLOADER (GRUB)
# ---------------------------------------------------------------------
d-i grub-installer/only_debian boolean true

# EFI-Wechselmedienpfad erzwingen (erhöht die Kompatibilität bei aktivem Secure Boot)
d-i grub-installer/force-efi-extra-removable boolean true

# ---------------------------------------------------------------------
# 9. ABSCHLUSS DER INSTALLATION (Automatischer Neustart)
# ---------------------------------------------------------------------
d-i finish-install/reboot_in_progress note
